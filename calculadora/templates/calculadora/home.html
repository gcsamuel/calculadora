<!DOCTYPE html>
<html lang="pt-br" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Django</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-200 via-slate-100 to-slate-300 text-slate-900 dark:from-slate-950 dark:via-slate-900 dark:to-slate-800 dark:text-slate-100">
    <div class="mx-auto flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-2xl rounded-[2rem] border border-slate-200/10 bg-white/90 p-8 shadow-2xl shadow-slate-900/15 backdrop-blur-xl transition duration-500 dark:border-slate-700/50 dark:bg-slate-900/90">
            <header class="mb-8 flex flex-col gap-4 rounded-[1.5rem] bg-slate-50 p-5 shadow-sm shadow-slate-200/80 transition dark:bg-slate-950/80 dark:shadow-slate-950/40 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center gap-4">
                    <div class="rounded-3xl bg-slate-900/10 px-4 py-3 text-sky-600 dark:bg-sky-500/15 dark:text-sky-200">
                        <span class="text-2xl">🧮</span>
                    </div>
                    <div>
                        <h1 class="text-4xl font-semibold tracking-tight text-slate-900 dark:text-white">Calculadora Django</h1>
                        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Fácil, rápida e visual moderna.</p>
                    </div>
                </div>
                <button id="themeToggle" type="button" class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-900 shadow-sm shadow-slate-200 transition duration-300 hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">
                    <span id="themeIcon" class="mr-2">🌙</span>
                    <span id="themeLabel">Modo Escuro</span>
                </button>
            </header>
            <form method="POST" class="grid gap-5 fade-in">
                {% csrf_token %}
                <div class="grid gap-2">
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="numero1">Primeiro número</label>
                    <input
                        id="numero1"
                        name="numero1"
                        type="number"
                        step="any"
                        placeholder="Ex: 12,5"
                        value="{{ numero1 }}"
                        required
                        class="w-full rounded-3xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:ring-4 focus:ring-sky-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"
                    >
                </div>
                <div class="grid gap-2">
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="operacao">Operação</label>
                    <select
                        id="operacao"
                        name="operacao"
                        class="w-full rounded-3xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:ring-4 focus:ring-sky-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"
                    >
                        <option value="soma" {% if operacao == 'soma' %}selected{% endif %}>Somar</option>
                        <option value="subtracao" {% if operacao == 'subtracao' %}selected{% endif %}>Subtrair</option>
                        <option value="multiplicacao" {% if operacao == 'multiplicacao' %}selected{% endif %}>Multiplicar</option>
                        <option value="divisao" {% if operacao == 'divisao' %}selected{% endif %}>Dividir</option>
                    </select>
                </div>
                <div class="grid gap-2">
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="numero2">Segundo número</label>
                    <input
                        id="numero2"
                        name="numero2"
                        type="number"
                        step="any"
                        placeholder="Ex: 8"
                        value="{{ numero2 }}"
                        required
                        class="w-full rounded-3xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:ring-4 focus:ring-sky-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"
                    >
                </div>
                <button
                    type="submit"
                    class="mt-2 inline-flex items-center justify-center rounded-3xl bg-gradient-to-r from-sky-500 to-cyan-400 px-6 py-3 text-base font-semibold text-slate-950 shadow-lg shadow-cyan-500/20 transition duration-300 hover:-translate-y-1 hover:shadow-cyan-500/30"
                >
                    Calcular
                </button>
            </form>
            {% if resultado is not None %}
                <div class="mt-8 rounded-3xl border border-emerald-400/20 bg-emerald-500/10 p-5 text-center text-2xl font-semibold text-emerald-900 shadow-inner shadow-emerald-500/10 dark:bg-emerald-500/15 dark:text-emerald-200">
                    Resultado: <span class="text-white">{{ resultado }}</span>
                </div>
            {% endif %}
            {% if erro %}
                <div class="mt-8 rounded-3xl border border-rose-400/20 bg-rose-500/10 p-5 text-center text-lg font-semibold text-rose-800 shadow-inner shadow-rose-500/10 dark:bg-rose-500/15 dark:text-rose-100">
                    {{ erro }}
                </div>
            {% endif %}
            <footer class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                Uma aplicação prática de Django com tema, animações e preenchimento automático.
            </footer>
        </div>
    </div>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        const root = document.documentElement;

        function setTheme(mode) {
            if (mode === 'dark') {
                root.classList.add('dark');
                if (themeIcon) themeIcon.textContent = '☀️';
                if (themeLabel) themeLabel.textContent = 'Modo Claro';
                localStorage.setItem('theme', 'dark');
            } else {
                root.classList.remove('dark');
                if (themeIcon) themeIcon.textContent = '🌙';
                if (themeLabel) themeLabel.textContent = 'Modo Escuro';
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleTheme() {
            setTheme(root.classList.contains('dark') ? 'light' : 'dark');
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', toggleTheme);

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }
    </script>
</body>
</html>
